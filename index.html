<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        color: #333333;
        }
        header {
        background-color: #1e293b;
        color: #ffffff;
        text-align: center;
        padding: 20px;
        }
        nav {
        background-color: #334155;
        text-align: center;
        padding: 10px;
        }
        nav a {
        color: #ffffff;
        text-decoration: none;
        padding: 8px 16px;
        display: inline-block;
        }
        nav a:hover {
        background-color: #0ea5e9;
        border-radius: 4px;
        }
        main{
        display:flex;
        }
        aside {
        width: 25%;
        float: left;
        background-color: #ffffff;
        padding: 20px;
        box-sizing: border-box;
        min-height: 450px;
        }
        aside h3 {
        color: #1e293b;
        border-bottom: 2px solid #0ea5e9;
        padding-bottom: 5px;
        }
        aside ul {
        list-style-type: none;
        padding: 0;
        }
        aside li {
        margin: 12px 0;
        }
        aside a {
        color: #475569;
        text-decoration: none;
        display: inline-block;
        padding: 6px;
        }
        aside a:hover {
        background-color: #f1f5f9;
        color: #0ea5e9;
        padding-left: 12px;
        }
        section {
        width: 75%;
        float: left;
        padding: 20px;
        box-sizing: border-box;
        }
        iframe {
        width: 100%;
        height: 400px;
        border: 2px solid #334155;
        background-color: #ffffff;
        }
        footer {
        background-color: #1e293b;
        color: #ffffff;
        text-align: center;
        padding: 15px;
        }
        footer span {
        color: #0ea5e9;
        font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Portafolio de Informática</h1>
    </header>
    <nav>
        <a href="https://github.com/Mica-Belu/informatica.git"><i class="bi bi-github"></i>Github</a>
        <a href="https://drive.google.com/drive/folders/1sjenevD0T-QvSvRBJDOc5fWg_c6cQ7U5?usp=sharing"><i class="bi bi-folder2"></i>Drive</a>
    </nav>
    <main>
        <aside>
            <ul>
                <li><a href="./pages/listas.html" target="visor">Ejercicio 1: Listas</a></li>
                <li><a href="./pages/tienda.html" target="visor">Ejercicio 2: Tablas</a></li>
                <li><a href="./pages/vocero.html" target="visor">Ejercicio 3: Semántica</a></li>
                <li><a href="./pages/diario.html" target="visor">Ejercicio 4: Iframe</a></li>
            </ul>
        </aside>
        <section>
            <iframe name="visor" src=""></iframe>
        </section>
    </main>
    <footer>
        <p>Nosotras somos Micaela y Catalina, alumnas de 3º año Economía</p>
    </footer>
</body>
</html>
